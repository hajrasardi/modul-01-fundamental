<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS: Flex</title>

    <style>
      #navbar {
        display: flex;
        border: 1px solid red;
        justify-content: space-between;
        align-items: center;
        padding: 0px 10px;
      }
      #nav-menu {
        display: flex;
        list-style: none;
        gap: 100px;
      }
    </style>
  </head>
  <body>
    <nav id="navbar">
      <img
        id="nav-logo"
        src="https://i.pinimg.com/736x/6e/56/24/6e5624ec98a5cc44fd9711950a2b6a16.jpg"
        width="50px"
      />
      <ul id="nav-menu">
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
      </ul>
      <div id="nav-action">
        <button>Sign In</button>
        <button>Sign Up</button>
      </div>
    </nav>
  </body>
</html>
